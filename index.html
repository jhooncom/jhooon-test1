 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator & Pet Face Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-violet-100">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center text-violet-800 my-8">Lotto Number Generator</h1>
        <lotto-generator></lotto-generator>

        <hr class="my-12 border-violet-200">

        <h2 class="text-2xl font-bold text-center text-violet-800 my-8">Pet Face Test</h2>
        <div class="text-center">
            <p class="text-violet-600 mb-4">Upload an image to see if you have a cat or a dog face!</p>
            <input type="file" id="image-upload" accept="image/*" class="file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100" onchange="readImage(this);">
            <div id="image-preview-container" class="mt-4 w-64 h-64 mx-auto rounded-lg overflow-hidden shadow-lg border-4 border-violet-300 flex justify-center items-center">
                <img id="image-preview" src="#" alt="Image Preview" class="hidden max-w-full max-h-full">
            </div>
            <div id="label-container" class="mt-4 text-xl font-semibold text-violet-800"></div>
        </div>

        <hr class="my-12 border-violet-200">

        <h2 class="text-2xl font-bold text-center text-violet-800 my-8">제휴 문의</h2>
        <form action="https://formspree.io/f/xjgerklr" method="POST" class="contact-form max-w-lg mx-auto bg-white p-8 rounded-lg shadow-lg">
            <p class="text-center text-violet-600 mb-6">제휴 문의가 있으시면 아래 양식을 작성해주세요.</p>
            <div class="mb-6">
                <label for="name" class="block text-violet-700 text-sm font-bold mb-2">Name:</label>
                <input type="text" id="name" name="name" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <div class="mb-6">
                <label for="email" class="block text-violet-700 text-sm font-bold mb-2">Email:</label>
                <input type="email" id="email" name="email" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <div class="mb-6">
                <label for="message" class="block text-violet-700 text-sm font-bold mb-2">Message:</label>
                <textarea id="message" name="message" rows="5" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"></textarea>
            </div>
            <button type="submit" class="w-full bg-violet-500 hover:bg-violet-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">제휴 문의 보내기</button>
        </form>

        <hr class="my-12 border-violet-200">

        <h2 class="text-2xl font-bold text-center text-violet-800 my-8">Comments</h2>
        <div id="disqus_thread"></div>
        <script>
            (function() {
                var d = document, s = d.createElement('script');
                s.src = 'https://jtjtjtj.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
            })();
        </script>
        <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>

    </div>
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/K6Im9VGeV/";

        let model, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function predict() {
            const image = document.getElementById("image-preview");
            const prediction = await model.predict(image, false);
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction =
                    prediction[i].className + ": " + prediction[i].probability.toFixed(2);
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }

        function readImage(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function (e) {
                    const imagePreview = document.getElementById("image-preview");
                    imagePreview.setAttribute('src', e.target.result);
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        
        init();
    </script>
</body>
</html>
