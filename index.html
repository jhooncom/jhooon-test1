 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator & Pet Face Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Lotto Number Generator</h1>
        <lotto-generator></lotto-generator>

        <hr style="margin: 3em 0; border-color: #eee;">

        <h2>Pet Face Test</h2>
        <p>Upload an image to see if you have a cat or a dog face!</p>
        <input type="file" id="image-upload" accept="image/*" onchange="readImage(this);">
        <div id="image-preview-container">
            <img id="image-preview" src="#" alt="Image Preview" onload="predict();">
        </div>
        <div id="label-container"></div>

        <hr style="margin: 3em 0; border-color: #eee;">

        <h2>제휴 문의</h2>
        <form action="https://formspree.io/f/xjgerklr" method="POST" class="contact-form">
            <p>제휴 문의가 있으시면 아래 양식을 작성해주세요.</p>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit">제휴 문의 보내기</button>
        </form>

        <hr style="margin: 3em 0; border-color: #eee;">

        <h2>Comments</h2>

    </div>
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/K6Im9VGeV/";

        let model, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function predict() {
            const image = document.getElementById("image-preview");
            const prediction = await model.predict(image, false);
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction =
                    prediction[i].className + ": " + prediction[i].probability.toFixed(2);
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }

        function readImage(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function (e) {
                    const imagePreview = document.getElementById("image-preview");
                    imagePreview.setAttribute('src', e.target.result);
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        
        init();
    </script>
</body>
</html>
